services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env            # must contain OPENAI_API_KEY and OMNIRAG_API_KEY
    environment:
      OMNIRAG_DATA_DIR: /data
      OMNIRAG_CORS_ORIGINS: http://localhost:8501
    volumes:
      - omnirag_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      OMNIRAG_API_URL: http://api:8000
      OMNIRAG_API_KEY: ${OMNIRAG_API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  omnirag_data:
